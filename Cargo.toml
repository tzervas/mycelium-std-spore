[package]
name = "mycelium-std-spore"
version.workspace = true
description = "std.spore — the content-addressed deployable + reconstruction-manifest library surface over the mycelium-spore packager (M-522)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "3958d2ea3c3921611e33f1f00e3469b29a939a76" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "f530c3db59a35fbb5769356555bda09997e96a1f" }
mycelium-std-content = { git = "https://github.com/tzervas/mycelium-std-content", rev = "93db7c19c2ab0f0d3860f27107422b94f684ba56" }
mycelium-std-vsa = { git = "https://github.com/tzervas/mycelium-std-vsa", rev = "ace751e8793087bbb01cb1f1d93511fc21121927" }
mycelium-std-numerics = { git = "https://github.com/tzervas/mycelium-std-numerics", rev = "0e5262e5e9f20cd9752c16b725eb6ed7b211c9ee" }
mycelium-spore = { git = "https://github.com/tzervas/mycelium-spore", rev = "986476e25c528828ef8384555208112f401de9e4" }
mycelium-proj = { git = "https://github.com/tzervas/mycelium-proj", rev = "985538d697430a361352f2805b2f2a9aadd1a3e5" }
mycelium-vsa = { git = "https://github.com/tzervas/mycelium-value", rev = "4e7e800eeaf392d4dcace425a618b43a528338ef" }
# blake3 is already a vetted workspace dependency (mycelium-core, mycelium-spore)
blake3.workspace = true
# serde_json is used for canonical manifest hashing (ReconManifest::manifest_hash)
serde_json.workspace = true

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-spore"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
