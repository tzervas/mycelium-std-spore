[package]
name = "mycelium-std-spore"
version.workspace = true
description = "std.spore — the content-addressed deployable + reconstruction-manifest library surface over the mycelium-spore packager (M-522)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "19398dfd847eb9a5fc518149a714d7646abbb316" }
mycelium-std-content = { git = "https://github.com/tzervas/mycelium-std-content", rev = "da8e5a3aabeab6d1453c3769bd346ebbdc93477c" }
mycelium-std-vsa = { git = "https://github.com/tzervas/mycelium-std-vsa", rev = "3be4787dffbc8d5c9c098ad2a7af6f6c96727046" }
mycelium-std-numerics = { git = "https://github.com/tzervas/mycelium-std-numerics", rev = "f411b8c6d1c473efaf11b649b9921bd787069369" }
mycelium-spore = { git = "https://github.com/tzervas/mycelium-spore", rev = "c5d88d90cbdd3b1b2db79715b676c60da9117352" }
mycelium-proj = { git = "https://github.com/tzervas/mycelium-proj", rev = "ccc1936734875d098fa99cce7570b23f1f6880e3" }
mycelium-vsa = { git = "https://github.com/tzervas/mycelium-value", rev = "fd4c3b307918fe6d58251a0b24a81e9f384d65ba" }
# blake3 is already a vetted workspace dependency (mycelium-core, mycelium-spore)
blake3.workspace = true
# serde_json is used for canonical manifest hashing (ReconManifest::manifest_hash)
serde_json.workspace = true

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-spore"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
